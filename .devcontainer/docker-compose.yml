services:
  ambush-dev-container:
    container_name: ambush-dev-container
    image: ghcr.io/devsoc-unsw/ambush-devcontainer
    stdin_open: true
    tty: true
    ports:
      # expose ports (3000 computer <-> 3000 on the container)
      - "3000:3000"
    volumes:
      - ../:/root/ambush
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:password@ambush-postgres:5432/ambush
    networks:
      - devsoc-network
    depends_on:
      ambush-postgres:
        condition: service_healthy
    security_opt:
      - seccomp:unconfined

  ambush-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ambush
    networks:
      - devsoc-network
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

networks:
  devsoc-network:
    driver: bridge