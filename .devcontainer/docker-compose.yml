name: ambush

services:
  ambush-dev-container:
    container_name: ambush-dev-container
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    # `docker compose build` / `up --build` tags the result as this name.
    image: ghcr.io/devsoc-unsw/ambush-devcontainer
    stdin_open: true
    tty: true
    ports:
      # expose ports (host <-> container)
      - "3000:3000" # frontend (vite)
      - "8080:8080" # backend (go)
    volumes:
      - ../:/root/ambush
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgres://postgres:password@ambush-metadata-postgres:5432/meta_ambush?sslmode=disable
    networks:
      - devsoc-network
    depends_on:
      ambush-metadata-postgres:
        condition: service_healthy
      spicedb-dev:
        condition: service_started
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined

  spicedb-dev:
    image: authzed/spicedb:latest-debug
    command: serve
    restart: always
    environment:
      - SPICEDB_GRPC_PRESHARED_KEY=secret-dev-key
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgres://postgres:password@ambush-spicedb-postgres:5432/spice_ambush?sslmode=disable
    networks:
      - devsoc-network
    ports:
      - "50067:50051"
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Migrate kratos db without thinking
  kratos-migrate:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://postgres:password@ambush-kratos-postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    volumes:
      - ../kratos:/etc/config/kratos:ro #path to our kratos configs
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes #path to kratos.yml
    networks:
      - devsoc-network
    depends_on:
      ambush-kratos-postgres:
        condition: service_healthy

  kratos:
    image: oryd/kratos:v1.3.0
    environment:
      - DSN=postgres://postgres:password@ambush-kratos-postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    ports:
      - "4433:4433" # Public API
      - "4434:4434" # Admin API (This port should be internal ONLYH)
      - "4467:4467" # Kratos frontend
    volumes:
      - ../kratos:/etc/config/kratos:ro
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
    restart: unless-stopped
    networks:
      - devsoc-network

  # Local SMTP catcher for verification / recovery emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - devsoc-network

  migrate:
    image: authzed/spicedb
    command: datastore migrate head
    environment:
      - SPICEDB_DATASTORE_ENGINE=postgres
      - SPICEDB_DATASTORE_CONN_URI=postgres://postgres:password@ambush-spicedb-postgres:5432/spice_ambush?sslmode=disable
    networks:
      - devsoc-network
    depends_on:
      ambush-spicedb-postgres:
        condition: service_healthy

  ambush-metadata-postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=meta_ambush
    ports:
      - "5432:5432"
    networks:
      - devsoc-network
    volumes:
      - metadata_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  ambush-spicedb-postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=spice_ambush
    ports:
      - "5467:5432" # Host: 5467 -> Container: 5432
    networks:
      - devsoc-network
    volumes:
      - spicedb_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    command: postgres -c track_commit_timestamp=on # flag needed for spicedb
  
  ambush-kratos-postgres:
    image: postgres:18-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=kratos
    ports:
      - "6767:5432" 
    networks:
      - devsoc-network
    volumes:
      - kratos_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  metadata_postgres_data:
  spicedb_postgres_data:
  kratos_postgres_data:

networks:
  devsoc-network:
    driver: bridge
