syntax = "proto3";

package ambush.audit.v1;

import "google/protobuf/timestamp.proto";

// read-only: entries are written by the other services, never by clients
service AuditService {
  rpc GetAuditEntry(GetAuditEntryRequest) returns (GetAuditEntryResponse);
}

enum AuditEntity {
  AUDIT_ENTITY_UNSPECIFIED = 0;
  AUDIT_ENTITY_SOCIETY = 1;
  AUDIT_ENTITY_SOCROLE = 2;
  AUDIT_ENTITY_MEMBERSHIP = 3;
}

enum AuditAction {
  AUDIT_ACTION_UNSPECIFIED = 0;
  AUDIT_ACTION_CREATE = 1;
  AUDIT_ACTION_UPDATE = 2;
  AUDIT_ACTION_DELETE = 3;
}

message AuditEntry {
  int64 id = 1;
  string change_set_id = 2; // uuid
  int32 society_id = 3;
  AuditEntity entity_type = 4;
  int32 entity_id = 5;
  AuditAction action = 6;
  string actor_id = 7; // uuid
  optional string before_json = 8; // unset on create
  optional string after_json = 9; // unset on delete
  optional int64 undoes_id = 10;
  google.protobuf.Timestamp created_at = 11;
}

message GetAuditEntryRequest {
  int64 id = 1;
}

message GetAuditEntryResponse {
  AuditEntry entry = 1;
}
