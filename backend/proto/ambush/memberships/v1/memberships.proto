syntax = "proto3";

package ambush.memberships.v1;

import "google/protobuf/timestamp.proto";

// all ids are uuid strings
service MembershipService {
  rpc CreateMembership(CreateMembershipRequest) returns (CreateMembershipResponse);
  // "given a person, which portfolios are they part of?"
  rpc ListUserPortfolios(ListUserPortfoliosRequest) returns (ListUserPortfoliosResponse);
}

message CreateMembershipRequest {
  string org_id = 1;
  string role_id = 2;
  string user_id = 3; // provided by ory
}

message CreateMembershipResponse {
  string membership_id = 1;
}

message ListUserPortfoliosRequest {
  string user_id = 1; // provided by ory
}

message ListUserPortfoliosResponse {
  repeated Portfolio portfolios = 1;
}

// one role a user currently holds, with its team and org
message Portfolio {
  string membership_id = 1;
  google.protobuf.Timestamp joined_at = 2;
  string role_id = 3;
  string role_name = 4;
  string team_id = 5;
  string team_name = 6;
  string org_id = 7;
  string org_name = 8;
  string org_slug = 9;
}
