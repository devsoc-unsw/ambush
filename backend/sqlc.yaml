version: "2"
sql:
  - engine: postgresql
    # sqlc reads the goose migrations as the schema (it skips the Down parts)
    schema: internal/repository/postgres/migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: db
        out: internal/repository/postgres/db
        sql_package: pgx/v5
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              type: time.Time
              pointer: true
