version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: backend/gen
# run `buf generate` from the repo root. the plugins are go tools declared in
# backend/go.mod, so `go -C backend` runs them from there
plugins:
  - local: ["go", "-C", "backend", "tool", "protoc-gen-go"]
    out: backend/gen
    opt: paths=source_relative
  - local: ["go", "-C", "backend", "tool", "protoc-gen-go-grpc"]
    out: backend/gen
    opt: paths=source_relative
